services:
  web:
    image: epoch-quoter:local
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: /epoch
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:3000"
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/epoch/api/catalog').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
