# Include inside the existing HTTPS server for 185.249.225.58.
location = /epoch {
    proxy_pass http://127.0.0.1:3102;
    include /etc/nginx/snippets/epoch-quoter-proxy.conf;
}

location ^~ /epoch/ {
    proxy_pass http://127.0.0.1:3102;
    include /etc/nginx/snippets/epoch-quoter-proxy.conf;
}

location @epoch_quoter_throttled {
    default_type application/json;
    add_header Retry-After 5 always;
    return 429 '{"error":"Too many requests. Try again shortly."}';
}
